[project]
name = "sdrag"
version = "0.1.0"
description = "Large-scale document RAG search system (API, ingestion worker, retrieval, eval)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pypdf>=5",
    "lxml>=5",
    "python-docx>=1.1",
    "pdfplumber>=0.11.10",
    "boto3[crt]>=1.44.0",
    "opensearch-py>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "rapidfuzz>=3.14.6",
    "numpy>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
