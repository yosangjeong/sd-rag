# Retrieval evaluation gate: changes to parsing, chunking or retrieval are scored on
# the dev set (never the test set) and fail if accuracy drops (eval/gate.py).
# Runs a local OpenSearch with nori in the runner, indexes the corpus from S3 with the
# embedding cache (EvalRole: read the corpus, invoke the models), then queries.
name: eval
on:
  pull_request:
    paths: ["backend/src/sdrag/ingest/**", "backend/src/sdrag/retrieval/**", "eval/**"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EVAL_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: OpenSearch with nori
        run: infra/local/opensearch/get-nori.sh && infra/local/opensearch/up.sh
      - name: Corpus and caches from S3
        run: |
          aws s3 sync "s3://${{ vars.CORPUS_BUCKET }}/corpus/data" data
          aws s3 sync "s3://${{ vars.CORPUS_BUCKET }}/corpus/cache/ocr" data/raw/ocr-cache
          aws s3 sync "s3://${{ vars.CORPUS_BUCKET }}/corpus/cache/embed" data/raw/embed-cache
      - name: Index
        working-directory: backend
        env: { SDRAG_OCR_CACHE_DIR: ../data/raw/ocr-cache, SDRAG_EMBED_CACHE_DIR: ../data/raw/embed-cache }
        run: uv sync --frozen && uv run python -m sdrag.ingest.pipeline --strategy structure --recreate
      - name: Score the dev set and compare with the baseline
        working-directory: backend
        run: |
          uv run python ../eval/run_retrieval.py --set ../data/eval/dev.jsonl --out ../data/raw/ci-eval \
            --systems bilingual+rerank@chunks-structure
          uv run python ../eval/gate.py ../data/raw/ci-eval/summary.json ../data/eval/baseline-dev.json
