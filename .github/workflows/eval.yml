# Retrieval evaluation gate: changes to parsing, chunking or retrieval are scored on
# the dev set (never the test set) and fail if accuracy drops (eval/gate.py).
# Runs a local OpenSearch with nori in the runner, indexes the corpus in data/corpus/
# with the OCR and embedding caches from S3 (EvalRole: read them, invoke the models),
# then queries.
name: eval
on:
  pull_request:
    paths: ["backend/src/sdrag/ingest/**", "backend/src/sdrag/retrieval/**", "eval/**"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EVAL_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: OpenSearch with nori
        run: infra/local/opensearch/get-nori.sh && infra/local/opensearch/up.sh
      - name: OCR and embedding caches from S3 
        run: |
          aws s3 sync "s3://${{ vars.CORPUS_BUCKET }}/corpus/cache/ocr" /home/runner/cache/ocr
          aws s3 sync "s3://${{ vars.CORPUS_BUCKET }}/corpus/cache/embed" /home/runner/cache/embed
      - name: Index
        working-directory: backend
        env: { SDRAG_OCR_CACHE_DIR: /home/runner/cache/ocr, SDRAG_EMBED_CACHE_DIR: /home/runner/cache/embed }
        run: uv sync --frozen && uv run python -m sdrag.ingest.pipeline --strategy structure --recreate
      - name: Score the dev set and compare with the baseline
        working-directory: backend
        run: |
          uv run python ../eval/run_retrieval.py --set ../data/eval/dev.jsonl --out ../ci-eval \
            --systems bilingual_union+rerank@chunks-structure
          uv run python ../eval/gate.py ../ci-eval/summary.json ../data/eval/baseline-dev.json
